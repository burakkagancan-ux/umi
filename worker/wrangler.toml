# Etiket Oku OCR Worker'ı. Cloudflare "Workers Builds" bu klasörden (root directory: worker) dağıtır.
# name, Cloudflare panelindeki Worker adıyla AYNI olmalı; değilse dağıtım başarısız olur.
name = "inapp-ocr-3a8f"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
keep_vars = true

# ALLOWED_ORIGIN ve VISION_KEY panelde (Settings > Variables and Secrets) tanımlı; keep_vars = true
# sayesinde dağıtım onları silmez. Burada tekrar tanımlanmaz (gizli değişkenle çakışmasın diye).

# Kayıt (log) kapalı: fotoğraf ve metin hiçbir yerde tutulmaz
# Hata kaydı (15.10.2026, kullanıcı kararı): yalnızca Worker'ın kendi kayit() satırları (olay adı, kısa ayrıntı; IP ve içerik yok).
# İstek kayıtları (invocation_logs) kapalı: IP, başlık ve adres içerdiği için. Panel: Workers & Pages > inapp-ocr-3a8f > Observability.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

# IP başına dakikada en fazla 6 okuma
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 6
  period = 60

# Tüm kullanıcılar için dakikada en fazla 30 okuma (Cloudflare konumu başına)
[[ratelimits]]
name = "GLOBAL_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

# VISION_KEY gizli değişkeni panelde zaten tanımlı; dağıtım onu silmez. Yeniden tanımlamak gerekirse:
#   Settings > Variables and Secrets > Add > Type: Secret, Name: VISION_KEY

# Katkı denetimi sayfası (/yonetim, O-21): Settings > Variables and Secrets > Add > Type: Secret, Name: YONETIM_ANAHTARI,
# değer en az 32 karakterlik rastgele bir metin (ör. parola yöneticisinin ürettiği). Tanımlı değilse yönetim kapalıdır.
# Burada yazılmaz (depo herkese açık).

# Katkı izi (19.10.2026, kullanıcı kararı): Settings > Variables and Secrets > Add > Type: Secret, Name: KATKI_TUZ, değer en az
# 32 karakterlik rastgele bir metin (YONETIM_ANAHTARI'ndan farklı). Aynı ağdan gelen katkıların birbirini doğrulamasını önler
# (src/index.js katkiIz). Tanımlı değilse iz yazılmaz, yalnızca katkıcı kimliği karşılaştırılır. Değiştirilirse eski izler
# yenileriyle eşleşmez (o barkodlarda bir süre koruma zayıflar); gerekmedikçe değiştirilmez.

# Paylaşım sayacı için IP başına dakikada en fazla 10 istek
[[ratelimits]]
name = "SAYAC_LIMIT"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

# Barkod uç noktaları (/off, /urun) için IP başına dakikada en fazla 30 istek
[[ratelimits]]
name = "BARKOD_LIMIT"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 30
  period = 60

# Anonim paylaşım sayacı (KV). Panelde Storage & Databases > KV > Create: "paylasim-sayac".
# Namespace ID yazıldı; sayaç bu bağlamayla çalışır (bağlı değilse /sayac sayım yapmadan 204 döner).
[[kv_namespaces]]
binding = "SAYAC"
id = "44f2c5a4b1ae41908edbb776a10e54a1"

# Barkodlu ürün veritabanı (D1, ücretsiz katman). Panelde Storage & databases > D1 > Create: "tagsis-urunler"
# (08.10.2026). Bağlama yalnızca burada tanımlanır: panelden "Add binding" ile eklenen bağlama Workers Builds
# dağıtımında silinir. Worker kodu bu bağlamayı barkod işiyle kullanmaya başlar; bağlı değilse uç noktalar
# sessizce devre dışı kalır. Tablolar Worker'ın ilk isteğinde otomatik oluşur (CREATE TABLE IF NOT EXISTS).
[[d1_databases]]
binding = "URUNLER"
database_name = "tagsis-urunler"
database_id = "fd2764c5-a992-4c5f-83c4-32d9098c5941"

# Topluluk (G-04): aynı IP aynı barkodun "aranıyor" sayısını dakikada en çok bir kez artırır (IP saklanmaz, yalnızca sınırın anahtarı)
[[ratelimits]]
name = "ARANAN_LIMIT"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 1
  period = 60
