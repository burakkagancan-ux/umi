name: Veriyi güncelle
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veri-guncelle
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_data_arsivli.py   # fetch_data.py + kaldırılan kayıtları data/arsiv.json'a yazar
      - name: Veriyi doğrula
        # Geçersizse iş burada durur; aşağıdaki adım çalışmaz, hiçbir şey gönderilmez.
        run: python dogrula_veri.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "umi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tagsis.json data/arsiv.json data/durum.json
          git diff --cached --quiet || (git commit -m "Veri güncellendi" && git push)
