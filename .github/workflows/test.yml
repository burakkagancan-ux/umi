name: Testler
# Her PR'da ve main'e her gönderimde tüm testleri çalıştırır. "test" işinde dış bağımlılık yok; "arayuz" işi Playwright kurar.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sözdizimi (sayfalardaki script blokları)
        run: node test/sozdizimi.js
      - name: Gıda
        run: node test/cases.js
      - name: E kodu kaynakları
        run: node test/e_dogrulama.js
      - name: Tuz / sodyum
        run: node test/sodyum.js
      - name: Kanserojen uyarısı
        run: node test/kanser.js
      - name: Birlikte dikkat
        run: node test/eslesme.js
      - name: Üretim yolu
        run: node test/uretim.js
      - name: OCR toleransı
        run: node test/ocr_tolerans.js
      - name: İngilizce etiket tanıma (eşikler, benzer yazım, diller arası çakışma)
        run: node test/ingilizce.js
      - name: Kozmetik veri
        run: node test/kozmetik_veri.js
      - name: Kozmetik durumlar
        run: node test/kozmetik_cases.js
      - name: Kozmetik K3
        run: node test/kozmetik_k3.js
      - name: Temizlik
        run: node test/temizlik.js
      - name: Karşılaştırma
        run: node test/karsilastir.js
      - name: Ansiklopedi
        run: node test/ansiklopedi.js
      - name: Paylaşım kartı
        run: node test/paylas.js
      - name: Kaydedilen ürünler
        run: node test/kayit.js
      - name: Cihaz verisi sürümü
        run: node test/veri_surum.js
      - name: Barkod
        run: node test/barkod.js
      - name: Besin değeri tablosu
        run: node test/besin.js
      - name: Çevrimdışı önbellek listesi
        run: node test/onbellek.js
      - name: Çeviri (anahtarlar, yer tutucular, taşınmamış metin)
        run: node test/ceviri.js
      - name: Bakanlık verisi doğrulaması
        run: python3 test/dogrula_veri.py
      - name: OCR Worker
        run: node worker/test.mjs
      - name: Veri üreteçleri (data/ ile kaynak/ uyumlu mu)
        # Üreteçleri depodaki kaynak dosyalarıyla çalıştırır; data/ değişirse JSON elle düzenlenmiş ya da üreteç çalıştırılmamış demektir.
        run: |
          for g in gen_e_kodlari gen_bilesenler gen_e_aciklama gen_kozmetik gen_eslesmeler gen_temizlik gen_ansiklopedi gen_ceviri_veri gen_barkod gen_besin; do python3 $g.py; done
          git diff --stat --exit-code -I '"generated":' -- data/ i18n/veri/
          # Üretecin yazdığı ama depoya eklenmemiş dosya (ör. yeni ansiklopedi sayfası data/ansiklopedi/<kimlik>.json)
          yeni=$(git ls-files --others --exclude-standard -- data/ i18n/veri/); if [ -n "$yeni" ]; then echo "Depoda olmayan üretilmiş dosya:"; echo "$yeni"; exit 1; fi
      - name: Değerlendirme değişiklik kaydı (renk değişti mi, kaydı var mı)
        run: python3 degisiklik_kaydi.py

  # Arayüz: sayfalar gerçek tarayıcıda (Chromium) açılıp tıklanır; üç modda analiz, karşılaştırma, ansiklopedi, çevrimdışı açılış.
  arayuz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright ve Chromium kurulumu
        run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Arayüz testi
        run: node test/arayuz.js
