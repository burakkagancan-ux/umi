name: Testler
# Her PR'da ve main'e her gönderimde tüm testleri çalıştırır. "test" işinde dış bağımlılık yok; "arayuz" işi Playwright kurar.
# Yeni test dosyası için buraya adım eklenmez: test/hepsi.js test/*.js, test/*.py ve worker/test*.mjs dosyalarını kendisi bulur.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Başlangıç zamanı (süre izleme, O-16)
        run: echo "BASLA=$(date +%s)" >> "$GITHUB_ENV"
      - name: Birim testleri (test/hepsi.js bütün test dosyalarını bulur ve paralel çalıştırır; altın çıktı dahil)
        run: node test/hepsi.js
      - name: Veri üreteçleri (data/ ile kaynak/ uyumlu mu)
        # Üreteçleri depodaki kaynak dosyalarıyla çalıştırır; data/ değişirse JSON elle düzenlenmiş ya da üreteç çalıştırılmamış demektir.
        run: |
          for g in gen_e_kodlari gen_bilesenler gen_e_aciklama gen_kozmetik gen_eslesmeler gen_temizlik gen_ansiklopedi gen_rozetler gen_ceviri_veri gen_barkod gen_besin gen_manifest; do python3 $g.py; done
          git diff --stat --exit-code -I '"generated":' -- data/ i18n/veri/ i18n/manifest/ manifest.webmanifest
          # Üretecin yazdığı ama depoya eklenmemiş dosya (ör. yeni ansiklopedi sayfası data/ansiklopedi/<kimlik>.json)
          yeni=$(git ls-files --others --exclude-standard -- data/ i18n/veri/ i18n/manifest/); if [ -n "$yeni" ]; then echo "Depoda olmayan üretilmiş dosya:"; echo "$yeni"; exit 1; fi
      - name: Değerlendirme değişiklik kaydı (renk değişti mi, kaydı var mı)
        run: python3 degisiklik_kaydi.py
      - name: Süre (8 dakikayı geçerse uyarı; zaman aşımı 15, O-16)
        if: always()
        run: |
          s=$(( $(date +%s) - BASLA )); echo "Süre: $((s/60)) dk $((s%60)) sn" >> "$GITHUB_STEP_SUMMARY"
          if [ "$s" -gt 480 ]; then echo "::warning::Bu iş $((s/60)) dakika sürdü (sınır 15). Testleri bölüp paralel çalıştırma zamanı (YOL_HARITASI.md O-16)."; fi

  # Arayüz: sayfalar gerçek tarayıcıda (Chromium) açılıp tıklanır; üç modda analiz, karşılaştırma, ansiklopedi, çevrimdışı açılış.
  arayuz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Başlangıç zamanı (süre izleme, O-16)
        run: echo "BASLA=$(date +%s)" >> "$GITHUB_ENV"
      - name: Playwright ve Chromium kurulumu
        run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Arayüz testi (test/arayuz/ grupları paralel)
        run: node test/arayuz.js
      - name: Süre (8 dakikayı geçerse uyarı; zaman aşımı 15, O-16)
        if: always()
        run: |
          s=$(( $(date +%s) - BASLA )); echo "Süre: $((s/60)) dk $((s%60)) sn" >> "$GITHUB_STEP_SUMMARY"
          if [ "$s" -gt 480 ]; then echo "::warning::Bu iş $((s/60)) dakika sürdü (sınır 15). Testleri bölüp paralel çalıştırma zamanı (YOL_HARITASI.md O-16)."; fi
